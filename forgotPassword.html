<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | UserHub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="auth-body">
    <main class="auth-shell auth-shell-single">
        <section class="auth-card">
            <a class="brand brand-center" href="index.html">
                <span class="brand-icon"><i class="fa-solid fa-layer-group"></i></span>
                <span>UserHub <small>ACCOUNT RECOVERY</small></span>
            </a>
            <div class="auth-heading">
                <p class="eyebrow">PASSWORD RECOVERY</p>
                <h1>Reset your password</h1>
                <p>Enter your account email and we will send a reset link.</p>
            </div>
            <form id="resetForm" class="form-stack">
                <label class="field"><span>Email address</span><span class="input-wrap"><i class="fa-regular fa-envelope"></i><input id="email" type="email" placeholder="name@example.com" required></span></label>
                <button class="btn btn-primary btn-full" id="resetBtn" type="submit">Send reset link <i class="fa-solid fa-paper-plane"></i></button>
                <p id="resetMessage" class="form-message" role="status"></p>
            </form>
            <p class="auth-footer"><a href="index.html">Back to sign in</a></p>
        </section>
    </main>
    <script type="module" src="forgotPassword.js"></script>
</body>
</html>
